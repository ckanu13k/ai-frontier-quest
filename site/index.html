<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Frontier Quest</title>
<meta name="description" content="Learn the week's most important AI and ML research in short lessons, then practice with quizzes, boss battles, a 60-second Blitz and spaced review.">
<meta property="og:title" content="AI Frontier Quest">
<meta property="og:description" content="Weekly AI/ML research lessons with quizzes, boss battles, Blitz and spaced review.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AI Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: an edtech app shell. Desktop = left sidebar with the learner's player card; phone = top bar + bottom tab bar. Topics are lessons with a 4-step stepper; the Arcade holds the replay modes. Teal is the learning colour, amber is reward. */
:root {
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --ink: #0F172A;
  --ink-2: #475569;
  --ink-3: #94A3B8;
  --line: #E2E8F0;
  --primary: #0D9488;
  --primary-600: #0F766E;
  --primary-50: #E6F6F4;
  --on-primary: #FFFFFF;
  --xp: #F59E0B;
  --xp-50: #FEF3C7;
  --xp-ink: #92400E;
  --streak: #F97316;
  --good: #16A34A;
  --good-50: #DCFCE7;
  --bad: #E11D48;
  --bad-50: #FFE4E6;
  --fresh: #16A34A;
  --current: #2563EB;
  --aging: #D97706;
  --stale: #DC2626;
  --classic: #7C3AED;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
  --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 10px 28px -14px rgba(15, 23, 42, .22);
  --r: 18px;
  --r-sm: 12px;
  --f-display: "Sora", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1120; --surface: #111A2B; --surface-2: #162133; --ink: #E5E9F0; --ink-2: #A6B1C4; --ink-3: #6B7A92; --line: #233049;
    --primary: #2DD4BF; --primary-600: #5EEAD4; --primary-50: rgba(45, 212, 191, .13); --on-primary: #042F2E;
    --xp: #FBBF24; --xp-50: rgba(251, 191, 36, .15); --xp-ink: #FCD34D; --streak: #FB923C;
    --good: #22C55E; --good-50: rgba(34, 197, 94, .16); --bad: #FB7185; --bad-50: rgba(251, 113, 133, .16);
    --fresh: #4ADE80; --current: #60A5FA; --aging: #FBBF24; --stale: #F87171; --classic: #A78BFA;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1120; --surface: #111A2B; --surface-2: #162133; --ink: #E5E9F0; --ink-2: #A6B1C4; --ink-3: #6B7A92; --line: #233049;
  --primary: #2DD4BF; --primary-600: #5EEAD4; --primary-50: rgba(45, 212, 191, .13); --on-primary: #042F2E;
  --xp: #FBBF24; --xp-50: rgba(251, 191, 36, .15); --xp-ink: #FCD34D; --streak: #FB923C;
  --good: #22C55E; --good-50: rgba(34, 197, 94, .16); --bad: #FB7185; --bad-50: rgba(251, 113, 133, .16);
  --fresh: #4ADE80; --current: #60A5FA; --aging: #FBBF24; --stale: #F87171; --classic: #A78BFA;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
a { color: var(--primary-600); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -0.02em; line-height: 1.15; margin: 0; text-wrap: balance; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 16px; height: 16px; }
.ico.lg { width: 26px; height: 26px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 22px 16px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: -0.02em; text-decoration: none; color: var(--ink); border: 0; background: none; cursor: pointer; padding: 0 6px; }
.brand .mark { width: 34px; height: 34px; border-radius: 10px; flex: none; }
.navlist { display: grid; gap: 4px; }
.navlink { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 0; background: none; cursor: pointer; font-weight: 600; color: var(--ink-2); text-align: left; width: 100%; }
.navlink:hover { background: var(--surface-2); color: var(--ink); }
.navlink[aria-current="page"] { background: var(--primary-50); color: var(--primary-600); }
.navlink .count { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 99px; background: var(--xp); color: #1F1300; font-size: 12px; display: grid; place-items: center; font-weight: 700; }
.player { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; background: var(--surface-2); }
.player-top { display: flex; gap: 12px; align-items: center; }
.ring { position: relative; width: 54px; height: 54px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; }
.ring.pulse { animation: pulse .9s ease-out 2; }
@keyframes pulse { 40% { transform: scale(1.12); } }
.player .title { font-weight: 700; font-size: 15px; }
.player .sub { font-size: 12.5px; color: var(--ink-2); }
.minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mini { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 6px; text-align: center; }
.mini b { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 15px; font-variant-numeric: tabular-nums; }
.mini span { font-size: 11px; color: var(--ink-3); }
.side-foot { margin-top: auto; display: grid; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
.side-foot .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

.topbar, .tabbar { display: none; }
.shell > div, .main > *, .hero-grid > *, .two-col > *, .lesson-grid > *, .arena > * { min-width: 0; }
.main { padding: 32px 36px 56px; max-width: 1180px; width: 100%; margin: 0 auto; display: grid; gap: 28px; align-content: start; }

/* ---------- primitives ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow-sm); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .12s ease, background .12s ease; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-600); }
.btn-reward { background: var(--xp); color: #1F1300; }
.btn-secondary { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-secondary:hover { border-color: var(--ink-3); }
.btn-ghost { background: transparent; color: var(--ink-2); min-height: 36px; padding: 6px 10px; }
.btn-ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn-sm { min-height: 34px; padding: 6px 12px; font-size: 13.5px; border-radius: 10px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.xp { background: var(--xp-50); color: var(--xp-ink); border-color: transparent; }
.chip.streak { background: color-mix(in srgb, var(--streak) 14%, transparent); color: var(--streak); border-color: transparent; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: color-mix(in srgb, currentColor 12%, transparent); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status.fresh { color: var(--fresh); } .status.current { color: var(--current); } .status.aging { color: var(--aging); } .status.stale { color: var(--stale); } .status.classic { color: var(--classic); } .status.archived { color: var(--ink-3); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--primary); transition: width .7s cubic-bezier(.2, .8, .2, 1); }
.bar.xp > i { background: linear-gradient(90deg, var(--xp), var(--streak)); }
.sec-h { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-h h2 { font-size: 21px; }
.sec-h .note { font-size: 13.5px; color: var(--ink-2); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.empty { padding: 32px; text-align: center; color: var(--ink-2); }
.page-h { display: grid; gap: 6px; }
.page-h h1 { font-size: clamp(26px, 3.2vw, 34px); }
.page-h p { margin: 0; color: var(--ink-2); max-width: 64ch; }

/* ---------- learn (home) ---------- */
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; }
.continue { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--primary-600), var(--primary)); color: #fff; border: 0; display: grid; gap: 14px; align-content: start; }
:root[data-theme="dark"] .continue { color: #042F2E; }
.continue .eyebrow { color: rgba(255, 255, 255, .78); }
.continue h2 { font-size: clamp(22px, 2.6vw, 28px); }
.continue p { margin: 0; opacity: .9; max-width: 52ch; }
.continue .steps-mini { display: flex; gap: 6px; }
.continue .steps-mini i { flex: 1; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .28); }
.continue .steps-mini i.on { background: #fff; }
.continue .btn { background: #fff; color: var(--primary-600); justify-self: start; }
.continue .deco { position: absolute; right: -40px; bottom: -50px; width: 220px; height: 220px; opacity: .14; pointer-events: none; }
.today { display: grid; gap: 14px; align-content: start; }
.today-top { display: flex; gap: 16px; align-items: center; }
.goal-ring { position: relative; width: 84px; height: 84px; flex: none; }
.goal-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.goal-ring div { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.goal-ring b { font-family: var(--f-display); font-size: 20px; }
.goal-ring small { font-size: 10.5px; color: var(--ink-3); }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.qtile { display: grid; gap: 8px; align-content: start; text-align: left; cursor: pointer; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; position: relative; }
.qtile:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--tc, var(--primary)) 45%, var(--line)); }
.qtile .qi { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--tc, var(--primary)) 14%, transparent); color: var(--tc, var(--primary)); }
.qtile b { font-size: 15.5px; }
.qtile span { font-size: 13px; color: var(--ink-2); }
.qtile .badge { position: absolute; top: 12px; right: 12px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; }
.chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.chips-scroll::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.course { text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .15s ease; position: relative; }
.course:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.course-top { display: flex; align-items: center; gap: 10px; }
.cat-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px; color: #fff; background: var(--cc, var(--primary)); flex: none; }
.course-top .meta { display: grid; line-height: 1.25; }
.course-top .meta small { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.course h3 { font-size: 17px; letter-spacing: -0.01em; }
.course p { margin: 0; font-size: 14px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.course-foot { margin-top: auto; display: grid; gap: 8px; }
.course-foot .line { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.new-tag { position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 800; letter-spacing: .06em; background: var(--xp); color: #1F1300; padding: 2px 8px; border-radius: 6px; }
.quests { display: grid; gap: 10px; }
.quest { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.quest b { font-size: 14.5px; font-weight: 600; }
.quest small { font-size: 12.5px; color: var(--ink-3); }
.quest .bar { grid-column: 1 / -1; }
.quest.claimed { opacity: .55; }
.changelog { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.changelog li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 14.5px; }
.changelog li svg { color: var(--primary); margin-top: 2px; }

/* ---------- lesson ---------- */
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-3); flex-wrap: wrap; }
.crumbs button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink-2); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.lesson-hero { display: grid; gap: 12px; }
.lesson-hero .meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lesson-hero h1 { font-size: clamp(26px, 3.4vw, 38px); }
.lesson-hero .tagline { margin: 0; font-size: 17px; color: var(--ink-2); max-width: 66ch; }
.stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.step { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; transition: border-color .15s ease; }
.step:hover { border-color: var(--primary); }
.step .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.step.done .n { background: var(--good); color: #fff; border-color: var(--good); }
.step.next { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-50); }
.step.next .n { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.step b { display: block; font-size: 14px; }
.step small { display: block; font-size: 12px; color: var(--ink-3); }
.lesson-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.lesson { display: grid; gap: 26px; padding: 28px; }
.lesson p { margin: 0; max-width: 70ch; }
.lesson h3 { font-size: 17px; margin-bottom: 10px; }
.lead { font-size: 17px; line-height: 1.65; }
.ideas { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.ideas li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; max-width: 70ch; }
.ideas li span { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--primary-50); color: var(--primary-600); }
.nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.num { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 4px; align-content: start; }
.num b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.num span { font-size: 13px; color: var(--ink-2); }
.num .rep { justify-self: start; font-size: 11px; font-weight: 700; color: var(--aging); background: color-mix(in srgb, var(--aging) 13%, transparent); border-radius: 6px; padding: 1px 7px; margin-top: 2px; }
.callout { border-radius: 14px; padding: 16px 18px; background: var(--primary-50); display: grid; gap: 6px; }
.callout h3 { margin: 0; font-size: 15px; color: var(--primary-600); }
.srcs { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.srcs a { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.srcs a:hover { border-color: var(--primary); }
.srcs a b { font-weight: 600; font-size: 14.5px; }
.srcs a small { grid-column: 1; font-size: 12.5px; color: var(--ink-3); }
.srcs a svg { grid-row: 1 / span 2; grid-column: 2; color: var(--ink-3); }
.aside { display: grid; gap: 16px; position: sticky; top: 24px; }
.checklist { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.checklist li { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.checklist .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.checklist .tick.on { background: var(--good); border-color: var(--good); color: #fff; }
.related { display: grid; gap: 8px; }
.related button { display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; cursor: pointer; font-size: 13.5px; font-weight: 600; }
.related button:hover { border-color: var(--primary); }
.related .cat-ico { width: 30px; height: 30px; border-radius: 9px; font-size: 12px; }
.stars { display: inline-flex; gap: 2px; color: var(--line); }
.stars svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.stars .on { color: var(--xp); }
.lesson-cta { display: none; }

/* ---------- play ---------- */
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; box-shadow: var(--shadow); display: grid; gap: 18px; }
.play-top { display: flex; align-items: center; gap: 12px; }
.play-top .bar { flex: 1; height: 10px; }
.play-top .count { font-size: 13px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.combo { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; color: var(--streak); }
.topic-tag { font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.q { font-family: var(--f-display); font-size: clamp(19px, 2.4vw, 24px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
.opts { display: grid; gap: 10px; }

    g.timer = setInterval(function () {
      if (game !== g) return clearInterval(g.timer);
      var left = Math.max(0, g.end - Date.now());
      $("#btime").textContent = (left / 1000).toFixed(1) + " s";
      $("#tfill").style.width = Math.min(100, left / 600) + "%";
      $("#tbar").classList.toggle("low", left < 10000);
      if (left <= 0) blitzEnd();
    }, 100);
  }
  function blitzAnswer(v) {
    var g = game; if (!g || g.kind !== "blitz" || !g.running) return;
    var ok = v === g.cur.truth, card = $("#bcard");
    if (ok) { g.score++; g.streak++; sfx("tick"); if (g.streak % 5 === 0) { g.end += 2000; toast("<b>+2 s</b> · streak " + g.streak, "timer"); } }
    else { g.streak = 0; g.misses++; g.end -= 3000; sfx("no"); }
    $("#bscore").textContent = g.score; $("#bstreak").innerHTML = icon("flame", "sm") + "streak " + g.streak;
    card.classList.add(ok ? "ok" : "no");
    g.running = false;
    setTimeout(function () { if (game === g && Date.now() < g.end) { g.running = true; blitzDeal(); } }, ok ? 160 : 420);
  }
  function blitzEnd() {
    var g = game; clearInterval(g.timer); g.running = false; g.kind = "blitz-done";
    var newBest = g.score > S.blitzBest; if (newBest) S.blitzBest = g.score;
    setMax("blitzBest", g.score);
    var earned = award(g.score * 3, "Blitz " + g.score);
    if (newBest && g.score > 0) { confetti(); sfx("win"); }
    checkBadges(); save(); renderShell();
    stageShell(resultHtml(newBest && g.score > 0 ? "New high score" : "Time", g.score, g.misses + " miss" + (g.misses === 1 ? "" : "es") + " · best " + S.blitzBest, earned, '<button type="button" class="btn btn-primary" data-go="blitz">Play again</button><button type="button" class="btn btn-secondary" data-go="arcade">Back to Arcade</button>', "timer"), true);
  }

  // ---------- recall + match ----------
  function startCards(t) { game = { kind: "cards", t: t, deck: shuffle(t.cards.map(function (c, i) { return i; })), known: 0, flipped: false }; renderCards(); }
  function renderCards() {
    var g = game;
    if (!g.deck.length) {
      var p = prog(g.t), earned = award(p.x_cards ? 4 : 15, "Recall cards");
      p.cards = true; p.x_cards = true; save();
      return stageShell(resultHtml("Recall complete", g.t.cards.length + "/" + g.t.cards.length, "All terms recalled. Step complete.", earned, '<button type="button" class="btn btn-primary" data-step="match">Next: Match</button><button type="button" class="btn btn-secondary" data-brief="1">Back to lesson</button>', "layers"));
    }
    var c = g.t.cards[g.deck[0]], total = g.t.cards.length;
    stageShell('<div class="play-top"><div class="bar"><i style="width:' + (g.known / total * 100) + '%"></i></div><span class="count">' + g.known + " / " + total + " known</span></div>" +
      '<div class="flip' + (g.flipped ? " on" : "") + '" id="flip"><div class="flip-inner" tabindex="0" role="button" aria-label="Flip card"><div class="face front"><b>' + esc(c.term) + '</b><small>Say the meaning, then tap to flip</small></div><div class="face back">' + esc(c.def) + "</div></div></div>" +
      '<div class="tf"><button type="button" class="btn btn-secondary" id="again-card" style="min-height:52px">Show again later</button><button type="button" class="btn btn-primary" id="knew-card" style="min-height:52px">' + icon("check", "sm") + "I knew it</button></div>", g.known > 0 || g.deck.length < total);
  }
  function startMatch(t) {
    var idx = shuffle(t.cards.map(function (c, i) { return i; }));
    var g0 = game = { kind: "match", t: t, left: idx, right: shuffle(idx), sel: null, done: {}, misses: 0, start: Date.now(), timer: null };
    renderMatch();
    g0.timer = setInterval(function () { var el = document.getElementById("clock"); if (el && game === g0) el.textContent = ((Date.now() - g0.start) / 1000).toFixed(0) + " s"; else clearInterval(g0.timer); }, 500);
  }
  function renderMatch() {
    var g = game, t = g.t, done = Object.keys(g.done).length;
    stageShell('<div class="play-top"><div class="bar"><i style="width:' + (done / t.cards.length * 100) + '%"></i></div><span class="count"><span id="clock" class="mono">' + ((Date.now() - g.start) / 1000).toFixed(0) + ' s</span> · misses <span class="mono" id="misses">' + g.misses + '</span></span></div><p class="muted" style="margin:0;font-size:14px">Pick a term, then its meaning.</p>' +
      '<div class="match"><div class="col">' + g.left.map(function (i) { return '<button type="button" class="tile term' + (g.done[i] ? " done" : "") + (g.sel === i ? " sel" : "") + '" data-term="' + i + '"' + (g.done[i] ? " disabled" : "") + ">" + esc(t.cards[i].term) + "</button>"; }).join("") + "</div>" +
      '<div class="col">' + g.right.map(function (i) { return '<button type="button" class="tile' + (g.done[i] ? " done" : "") + '" data-def="' + i + '"' + (g.done[i] ? " disabled" : "") + ">" + esc(t.cards[i].def) + "</button>"; }).join("") + "</div></div>", done > 0 || g.sel !== null);
  }
  function pickDef(i, el) {
    var g = game; if (g.sel === null) { toast("Pick a term first."); return; }
    if (g.sel === i) { g.done[i] = true; g.sel = null; sfx("ok"); }
    else { g.misses++; sfx("no"); el.classList.add("shake"); setTimeout(function () { el.classList.remove("shake"); }, 400); $("#misses").textContent = g.misses; return; }
    if (Object.keys(g.done).length === g.t.cards.length) return endMatch();
    renderMatch();
  }
  function endMatch() {
    var g = game; clearInterval(g.timer); g.timer = null;
    var secs = Math.round((Date.now() - g.start) / 1000), p = prog(g.t);
    var bonus = Math.max(0, Math.round((60 - secs) / 2) - g.misses * 3), base = 30 + bonus, earned = award(p.x_match ? base * 0.25 : base, "Term match in " + secs + " s");
    p.match = true; p.x_match = true; p.matchBest = p.matchBest == null ? secs : Math.min(p.matchBest, secs);
    if (secs < 40 && g.misses === 0) p.speed = true;
    bump("matches"); checkBadges(); save(); renderShell();
    var all = stepsDone(g.t).every(Boolean);
    if (all) confetti();
    stageShell(resultHtml(all ? "Lesson complete" : "Match cleared", secs + " s", g.misses + " miss" + (g.misses === 1 ? "" : "es") + " · best " + p.matchBest + " s", earned, '<button type="button" class="btn btn-primary" data-go="">' + (all ? "Next lesson" : "Back to Learn") + '</button><button type="button" class="btn btn-secondary" data-brief="1">Back to lesson</button>', "trophy"));
  }

  // ---------- routing ----------
  function stopGame() { if (game && game.timer) clearInterval(game.timer); game = null; }
  function route() {
    stopGame();
    if (!DATA) return;
    var h = (location.hash || "").replace(/^#/, "");
    if (h === "arcade") viewArcade();
    else if (h === "profile") viewProfile();
    else if (h === "daily") startDaily();
    else if (h === "review") startReview();
    else if (h === "boss") startBoss();
    else if (h === "blitz") startBlitz();
    else if (h.indexOf("t-") === 0 && byId(h.slice(2))) viewTopic(byId(h.slice(2)));
    else viewLearn();
    renderShell();
    window.scrollTo(0, 0);
  }
  function go(h) { if (("#" + h) === location.hash || (!h && !location.hash)) route(); else location.hash = h; }
  function currentTopic() { if (game && game.t) return game.t; var h = (location.hash || "").replace(/^#/, ""); return h.indexOf("t-") === 0 ? byId(h.slice(2)) : null; }
  function startStep(t, step) {
    stopGame();
    if (step === "read") {
      var p = prog(t);
      if (!p.read) { p.read = true; p.stale = false; award(p.x_read ? 5 : 20, "Briefing read"); p.x_read = true; bump("reads"); save(); }
      return viewTopic(t);
    }
    var host = document.getElementById("stage-host");
    if (!host) return;
    host.classList.remove("lesson");
    if (step === "quiz") startTopicQuiz(t); else if (step === "cards") startCards(t); else startMatch(t);
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go],[data-filter],[data-step],[data-opt],[data-pu],[data-term],[data-def],[data-brief],[data-claim],[data-tf],[data-act],#nextQ,#again-card,#knew-card,.flip-inner,#blitzGo,#resetYes,#resetNo");
    if (!el) return;
    if (el.hasAttribute("data-go")) return go(el.getAttribute("data-go"));
    if (el.hasAttribute("data-filter")) { filter = el.getAttribute("data-filter"); return viewLearn(); }
    var t = currentTopic();
    if (el.hasAttribute("data-step") && t) return startStep(t, el.getAttribute("data-step"));
    if (el.hasAttribute("data-opt")) return answer(+el.getAttribute("data-opt"));
    if (el.hasAttribute("data-pu")) return usePU(el.getAttribute("data-pu"));
    if (el.id === "nextQ") return nextQ();
    if (el.hasAttribute("data-brief") && t) { stopGame(); return viewTopic(t); }
    if (el.hasAttribute("data-claim")) {
      var w = week(); S.qc[w] = S.qc[w] || {}; S.qc[w][el.getAttribute("data-claim")] = true;
      award(75, "Quest complete"); grantPU("Quest"); sfx("win"); checkBadges(); save();
      return section() === "arcade" ? viewArcade() : viewLearn();
    }
    if (el.hasAttribute("data-tf")) return blitzAnswer(el.getAttribute("data-tf") === "1");
    if (el.id === "blitzGo") return blitzStart();
    if (el.classList.contains("flip-inner")) { game.flipped = !game.flipped; $("#flip").classList.toggle("on", game.flipped); return; }
    if (el.id === "knew-card") { game.deck.shift(); game.known++; game.flipped = false; return renderCards(); }
    if (el.id === "again-card") { game.deck.push(game.deck.shift()); game.flipped = false; return renderCards(); }
    if (el.hasAttribute("data-term")) { game.sel = +el.getAttribute("data-term"); return renderMatch(); }
    if (el.hasAttribute("data-def")) return pickDef(+el.getAttribute("data-def"), el);
    var act = el.getAttribute("data-act");
    if (act === "sound") { S.sound = !S.sound; save(); renderShell(); $$('.switch[data-act="sound"]').forEach(function (s) { s.setAttribute("aria-checked", String(!!S.sound)); }); if (S.sound) sfx("ok"); return; }
    if (act === "install" && deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.then(function () { deferredInstall = null; renderShell(); if (section() === "profile") viewProfile(); }); return; }
    if (act === "reset") { $("#resetBox").innerHTML = '<span class="confirm"><span class="muted" style="font-size:13px">Erase everything?</span><button type="button" class="btn btn-sm btn-secondary" id="resetNo">Cancel</button><button type="button" class="btn btn-sm btn-primary" id="resetYes" style="background:var(--bad)">Reset</button></span>'; return; }
    if (el.id === "resetYes") { S = blank(); save(); route(); toast("Progress reset.", "check"); return; }
    if (el.id === "resetNo") { $("#resetBox").innerHTML = '<button type="button" class="btn btn-secondary btn-sm" data-act="reset">Reset</button>'; return; }
  });
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "textarea") return;
    if (tag === "button" && (e.key === "Enter" || e.key === " ")) return;
    var g = game; if (!g) return;
    if (g.kind === "run") {
      var n = "1234".indexOf(e.key), a = "abcd".indexOf(e.key.toLowerCase()), j = n >= 0 ? n : a;
      if (j >= 0 && !g.answered) { var oi = g.items[g.i].order[j]; if (g.gone.indexOf(oi) < 0) { e.preventDefault(); answer(oi); } }
      else if (e.key === "Enter" && g.answered && $("#nextQ")) { e.preventDefault(); nextQ(); }
    } else if (g.kind === "blitz") {
      if (!g.running && !g.end && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return blitzStart(); }
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "f") { e.preventDefault(); blitzAnswer(false); }
      if (e.key === "ArrowRight" || e.key.toLowerCase() === "j") { e.preventDefault(); blitzAnswer(true); }
    } else if (g.kind === "cards") {
      if (e.key === " ") { e.preventDefault(); g.flipped = !g.flipped; $("#flip").classList.toggle("on", g.flipped); }
      if (e.key === "ArrowRight") { e.preventDefault(); $("#knew-card").click(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); $("#again-card").click(); }
    }
  });
  window.addEventListener("hashchange", route);
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferredInstall = e; renderShell(); });
  window.addEventListener("appinstalled", function () { deferredInstall = null; renderShell(); toast("App installed", "check"); });

  // ---------- boot ----------
  function start() {
    fetch("topics.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
      DATA = d;
      $("#editionSide").textContent = "Edition " + d.meta.edition + " · updated " + fmtShort(d.meta.generated);
      reviewItems(false); checkBadges(); save(); route();
    }).catch(function () {
      app.innerHTML = '<div class="card empty">The lessons didn\'t load. Check your connection and reload; if you just updated, try again in a minute.</div>';
    });
  }
  if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window && /github\.io$/.test(location.hostname)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
  if (window.claude && window.claude.hot) { try { window.claude.hot.snapshot(function () { return { hash: location.hash }; }); } catch (e) {} }
  renderShell();
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(function () { start(); }); else start();
})();
</script>
</body>
</html>
