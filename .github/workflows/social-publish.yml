name: Social - publish (Instagram + Threads)

# Checks every 20 minutes and posts whatever is due. Nothing to do most runs.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be posted"
        type: boolean
        default: false
      check:
        description: "Only test the Instagram and Threads connections (posts nothing)"
        type: boolean
        default: false
      post_ids:
        description: "Post these now, in order (comma-separated, e.g. 2026-W47-mon,2026-W47-tue)"
        type: string
        default: ""
      repost:
        description: "With post ids: post again even if already recorded (delete the old post first)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-assets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: social

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull social-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: social/scripts/assets.sh pull ../assets

      - name: Publish due post
        id: pub
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SOCIAL_PAUSED: ${{ vars.SOCIAL_PAUSED }}
        run: |
          if [ "${{ inputs.check }}" = "true" ]; then python social/publish.py --check; exit $?; fi
          EXTRA=""
          if [ -n "${{ inputs.post_ids }}" ]; then EXTRA="--post ${{ inputs.post_ids }}"; fi
          if [ "${{ inputs.repost }}" = "true" ]; then EXTRA="$EXTRA --repost"; fi
          python social/publish.py --assets ../assets ${{ inputs.dry_run && '--dry-run' || '' }} $EXTRA

      - name: Save publish state
        if: always() && steps.pub.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: social/scripts/assets.sh push ../assets "Publish state $(date -u +%FT%RZ)"
