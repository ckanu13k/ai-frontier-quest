name: Social - publish

# Checks every 20 minutes and posts whatever is due. Nothing to do most runs.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be posted"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-assets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: social

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull social-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: social/scripts/assets.sh pull ../assets

      - name: Publish due post
        id: pub
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SOCIAL_PAUSED: ${{ vars.SOCIAL_PAUSED }}
        run: python social/publish.py --assets ../assets ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save publish state
        if: always() && steps.pub.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: social/scripts/assets.sh push ../assets "Publish state $(date -u +%FT%RZ)"
