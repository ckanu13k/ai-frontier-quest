name: Social - build week

# Builds the week's 7 Instagram carousels from site/topics.json.
# Runs right after the Monday content refresh lands, with a Monday fallback.
on:
  push:
    branches: [main]
    paths: ["site/topics.json", "social/**"]
  schedule:
    - cron: "23 14 * * 1"   # Mondays ~8-9 AM Central, fallback if the push trigger was missed
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild this week even if it is already built"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: social-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # to tell whether this push changed the social code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: social/requirements.txt

      - name: Install renderer
        run: |
          pip install -r social/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pull social-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: social/scripts/assets.sh pull ../assets

      - name: Build this week's posts
        id: build
        run: |
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ] || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^social/'; then FORCE="--force"; fi
          python social/build_week.py --assets ../assets $FORCE

      - name: Push social-assets
        if: steps.build.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: social/scripts/assets.sh push ../assets "Build social posts (${GITHUB_SHA::7})"

      - name: Redeploy site so the new slides are live
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
