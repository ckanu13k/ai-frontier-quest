name: Social - refresh Instagram token

# Only needed for Instagram Login tokens (start with "IG", last 60 days): extends
# the token weekly and saves it back as the IG_ACCESS_TOKEN secret. System-user
# tokens from "API setup with Unified login" (start with "EAA") never expire, so
# this exits right away for them.
on:
  schedule:
    - cron: "41 15 * * 3"   # Wednesdays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: social
      - name: Refresh and store token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          case "$IG_ACCESS_TOKEN" in
            IG*) ;;
            "") echo "No IG_ACCESS_TOKEN yet; nothing to refresh."; exit 0 ;;
            *) echo "System-user token: it never expires, nothing to refresh."; exit 0 ;;
          esac
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the GH_SECRETS_PAT secret (see social/README.md) so the refreshed token can be saved."; exit 1; fi
          out=$(python social/refresh_token.py)
          echo "$out" | head -1          # registers the mask before the token is used
          new=$(echo "$out" | tail -1)
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$new"
          echo "IG_ACCESS_TOKEN updated."
