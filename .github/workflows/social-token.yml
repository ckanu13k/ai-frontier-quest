name: Social - refresh tokens

# Threads tokens (and Instagram Login tokens, which start with "IG") last 60 days.
# This extends them weekly and saves each back as its secret, so you never
# regenerate them by hand. The Instagram system-user token in use (starts with
# "EAA") never expires and is left alone.
on:
  schedule:
    - cron: "41 15 * * 3"   # Wednesdays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: social
      - name: Refresh and store tokens
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          todo=""
          case "$IG_ACCESS_TOKEN" in IG*) todo="$todo instagram" ;; esac
          [ -n "$THREADS_ACCESS_TOKEN" ] && todo="$todo threads"
          if [ -z "$todo" ]; then echo "No expiring tokens to refresh."; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the GH_SECRETS_PAT secret (see social/README.md) so refreshed tokens can be saved."; exit 1; fi
          for p in $todo; do
            out=$(python social/refresh_token.py "$p")
            echo "$out" | head -1          # registers the mask before the token is used
            new=$(echo "$out" | tail -1)
            secret=$([ "$p" = threads ] && echo THREADS_ACCESS_TOKEN || echo IG_ACCESS_TOKEN)
            gh secret set "$secret" --repo "$GITHUB_REPOSITORY" --body "$new"
            echo "$secret updated."
          done
