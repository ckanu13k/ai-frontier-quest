name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate topic content
        run: python scripts/validate_topics.py site/topics.json

      - name: Include Instagram slides (social-assets branch)
        run: |
          if git clone --quiet --depth 1 --branch social-assets "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/social-assets; then
            rm -rf /tmp/social-assets/.git && mkdir -p site/social && cp -r /tmp/social-assets/. site/social/
          else
            echo "No social-assets branch yet."
          fi

      - name: Stamp build info
        run: |
          echo "{\"commit\": \"${GITHUB_SHA::7}\", \"built\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > site/build.json

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
